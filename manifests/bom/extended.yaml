# Cyrenet OS Extended Profile Delta Package BOM (M0 Initial Baseline).
# Inherits all packages from core.yaml and standard.yaml.
# Policy: multi-WAN, multi-dial, historical L2 metrics, and L3 Prometheus exporter default to disabled.

schema_version: 1
profile: "extended"
upstream_version: "25.12.2"

packages:
